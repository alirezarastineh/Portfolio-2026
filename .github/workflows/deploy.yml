name: Deploy

# Manual on purpose: a button in the Actions tab, never on every push. It
# builds both images once, pushes them to GHCR, and has the Hetzner host pull
# and run exactly those — the host no longer compiles anything.
#
# One-time setup (see DEPLOYMENT.md, "Deploying from GitHub Actions"):
#   secrets  DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS
#   host     `docker login ghcr.io` with a read:packages token
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/alirezarastineh/portfolio-2026

jobs:
  images:
    name: Build and push images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Server image
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: |
            ${{ env.REGISTRY }}/api:${{ github.sha }}
            ${{ env.REGISTRY }}/api:latest
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - name: Client image
        uses: docker/build-push-action@v6
        with:
          context: client
          push: true
          # Must match the host's .env: the API URL is baked into the browser
          # bundle, and the internal URL into the SSR server.
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'https://api.alirezarastineh.me' }}
            API_INTERNAL_BASE_URL=http://api:${{ vars.API_PORT || '3000' }}
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
            VITE_UMAMI_SRC=${{ vars.VITE_UMAMI_SRC }}
            VITE_UMAMI_WEBSITE_ID=${{ vars.VITE_UMAMI_WEBSITE_ID }}
          tags: |
            ${{ env.REGISTRY }}/client:${{ github.sha }}
            ${{ env.REGISTRY }}/client:latest
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

  deploy:
    name: Roll out on Hetzner
    needs: images
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Pull and restart
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '~/Portfolio-2026' }}
          SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH=$DEPLOY_PATH IMAGE_TAG=$SHA bash -s" <<'REMOTE'
          set -euo pipefail
          cd "${DEPLOY_PATH/#\~/$HOME}"

          # Same as the documented `git pull --ff-only`, then a guard: the
          # checkout must be the commit the images were built from, or compose
          # config and container code would drift apart.
          git fetch --quiet origin master
          git merge --ff-only --quiet origin/master
          if [ "$(git rev-parse HEAD)" != "$IMAGE_TAG" ]; then
            echo "Host checkout $(git rev-parse --short HEAD) is not the built commit ${IMAGE_TAG:0:7}." >&2
            echo "Re-run the workflow from the latest master." >&2
            exit 1
          fi

          compose() {
            docker compose --env-file .env \
              -f deploy/hetzner/docker-compose.yml \
              -f deploy/hetzner/docker-compose.images.yml "$@"
          }
          compose pull api client
          compose up -d --no-build api client
          ./deploy/hetzner/verify-deploy.sh
          REMOTE

      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/deploy_key
