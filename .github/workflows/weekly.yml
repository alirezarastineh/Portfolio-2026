# Weekly checks (the GitHub Actions plan, Phase 8): Woodpecker's weekly.yaml on
# GitHub's runners, Mondays at 05:43 UTC (Woodpecker's runs at 09:00 local), and
# by hand: Actions → weekly → Run workflow.
# - gitleaks over the whole history, from Woodpecker's image;
# - `pnpm outdated` in both packages, a report only;
# - Woodpecker's version, and each action's pin, against their latest releases;
# - `inactivity`, on GitHub alone: GitHub switches the schedules off after 60
#   days without activity, so it fails at 45, while they still run.
# Steps that hold a value run ci/weekly.sh or a ci/ script, as Woodpecker's do
# (ci/ci-parity.mjs keeps the two in step). The scripts that ask GitHub's API
# send the workflow's token. A failed run emails the owner through GitHub's own
# notifications.
name: weekly

on:
  # An odd minute: GitHub delays schedules at the top of the hour, under load.
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:
    inputs:
      inactivity_days:
        description: "`inactivity` fails once the newest commit is this many days old (0: the red)"
        type: number
        default: 45

permissions:
  contents: read

# One weekly at a time per event, never cancelled.
concurrency:
  group: weekly-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  weekly:
    name: weekly
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Every commit, for gitleaks: the default checkout fetches one.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # pnpm outdated reads the lockfiles and the registry; nothing is installed.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.0.0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # gitleaks over the whole history (ci/weekly.sh), which must be there
      # first. GITHUB_ACTIONS lets the script put its result on the run's page.
      - name: history
        if: ${{ !cancelled() }}
        run: >-
          docker run --rm --entrypoint sh --volume "$PWD:/repo" --workdir /repo --env GITHUB_ACTIONS
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          ci/weekly.sh history

      # Report only: there is nearly always something.
      - name: outdated
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: sh ci/weekly.sh outdated

      - name: woodpecker
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node ci/woodpecker-version.mjs

      # A SHA that isn't its version's commit fails, and so does a newer release
      # once two weeks old.
      - name: action-pins
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node ci/action-pins.mjs

      # A scheduled run has no inputs: the script's 45 days apply.
      - name: inactivity
        if: ${{ !cancelled() }}
        env:
          INACTIVITY_DAYS: ${{ inputs.inactivity_days }}
        run: sh ci/weekly.sh inactivity
