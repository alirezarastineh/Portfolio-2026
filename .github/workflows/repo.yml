# Infrastructure lint (the GitHub Actions plan, Phase 2): Woodpecker's repo.yaml on
# GitHub's runners. The same steps run ci/repo.sh inside the same pinned images
# (ci/ci-parity.mjs keeps the two in step), and each step runs whatever the others
# found, so one run reports every failure.
name: repo

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      nightly:
        type: boolean
        default: false

permissions:
  contents: read

# Per workflow and event, so a push never cancels the nightly. Named literally: a
# called workflow sees its caller's github.workflow.
concurrency:
  group: repo-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every Woodpecker workflow, against the schema of the server's version.
      - name: workflows
        if: ${{ !cancelled() }}
        run: >-
          docker run --rm --entrypoint sh --volume "$PWD:/repo" --workdir /repo
          woodpeckerci/woodpecker-cli:v3.19.0-alpine ci/repo.sh workflows

      - name: shellcheck
        if: ${{ !cancelled() }}
        run: >-
          docker run --rm --entrypoint sh --volume "$PWD:/repo" --workdir /repo
          koalaman/shellcheck-alpine:v0.11.0 ci/repo.sh shellcheck

      - name: hadolint
        if: ${{ !cancelled() }}
        run: >-
          docker run --rm --entrypoint sh --volume "$PWD:/repo" --workdir /repo
          hadolint/hadolint:v2.15.1-alpine ci/repo.sh hadolint

      - name: compose
        if: ${{ !cancelled() }}
        run: >-
          docker run --rm --entrypoint sh --volume "$PWD:/repo" --workdir /repo
          docker:29.9.0-cli ci/repo.sh compose

      - name: caddy
        if: ${{ !cancelled() }}
        run: >-
          docker run --rm --entrypoint sh --volume "$PWD:/repo" --workdir /repo
          caddy:2.11.4-alpine ci/repo.sh caddy

      - name: trivy
        if: ${{ !cancelled() }}
        run: >-
          docker run --rm --entrypoint sh --volume "$PWD:/repo" --workdir /repo
          aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
          ci/repo.sh trivy

      - name: gitleaks
        if: ${{ !cancelled() }}
        run: >-
          docker run --rm --entrypoint sh --volume "$PWD:/repo" --workdir /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          ci/repo.sh gitleaks

      # GitHub's own workflows: actionlint and zizmor, which Woodpecker runs too.
      - name: actionlint
        if: ${{ !cancelled() }}
        run: >-
          docker run --rm --entrypoint sh --volume "$PWD:/repo" --workdir /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          ci/repo.sh actionlint

      - name: zizmor
        if: ${{ !cancelled() }}
        run: >-
          docker run --rm --entrypoint sh --volume "$PWD:/repo" --workdir /repo
          ghcr.io/zizmorcore/zizmor:1.30.1@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101
          ci/repo.sh zizmor

      # Node's built-ins only, so the runner's node runs it.
      - name: parity
        if: ${{ !cancelled() }}
        run: sh ci/repo.sh parity
