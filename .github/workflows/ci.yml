name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# GitHub's first workflow. Its jobs moved into the twins of Woodpecker's
# workflows (the GitHub Actions plan): the server's into server.yml (Phase 3),
# the client's and e2e into client.yml (Phase 4). The image builds go to
# images.yml in Phase 6, and this file with them. Actions are pinned to a commit
# SHA, with the release in a comment, as images are pinned by digest (Phase 2).
# The runner is ubuntu-24.04: ubuntu-latest moves to Ubuntu 26.04 from
# 2026-10-19.
jobs:
  docker:
    name: Docker images build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          push: false
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - name: Build client image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: client
          push: false
          build-args: |
            VITE_API_BASE_URL=https://api.alirezarastineh.me
            API_INTERNAL_BASE_URL=http://api:3000
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client
