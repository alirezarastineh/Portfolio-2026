name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Node and pnpm match the Dockerfiles, so CI checks what production builds.
env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.0.0"

jobs:
  server:
    name: Server — lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  client:
    name: Client — lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      # The whole repo, not just client/: schema-parity.spec.ts reads the
      # server's copy of the content schema.
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          VITE_API_BASE_URL: https://api.alirezarastineh.me

  e2e:
    name: Client — e2e, axe, Lighthouse
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Tests run against the bundled fallback content with every request to
      # another origin blocked, so the API URL baked in here is never reached.
      - run: pnpm build
        env:
          VITE_API_BASE_URL: https://api.alirezarastineh.me
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      # Uses the runner's preinstalled Chrome.
      - run: pnpm lhci
      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            client/playwright-report/
            client/test-results/
            client/.lighthouseci/
          if-no-files-found: ignore
          retention-days: 14

  docker:
    name: Docker images build
    needs: [server, client, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: server
          push: false
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - name: Build client image
        uses: docker/build-push-action@v6
        with:
          context: client
          push: false
          build-args: |
            VITE_API_BASE_URL=https://api.alirezarastineh.me
            API_INTERNAL_BASE_URL=http://api:3000
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client
