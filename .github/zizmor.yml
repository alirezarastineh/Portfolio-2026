# zizmor's rules for the GitHub workflows (the GitHub Actions plan, Phase 2). Every
# action is pinned to a commit SHA, as images are pinned by digest: zizmor's default
# lets actions/* and github/* use a tag.
rules:
  unpinned-uses:
    config:
      policies:
        "*": hash-pin
  # GitHub's self-repository syntax, `uses: $/…` (2026-07-30), which zizmor 1.30
  # asks for: actionlint 1.7.12 rejects it ("not following the format"). So
  # nightly.yml calls the check workflows with `./`, which for a job's call means
  # the caller's own commit (the GitHub Actions plan, Phase 5), until actionlint
  # takes `$/`.
  self-repository:
    ignore:
      - nightly.yml
