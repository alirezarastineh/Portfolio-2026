# Local development only: an optional throwaway Postgres 17.
#
# Production is deploy/hetzner/docker-compose.yml, always named explicitly with
# -f. This file used to be a drifted copy of that stack under the same project
# name, so a bare `docker compose up` on the server would have recreated the
# live containers from stale config on top of the production volume. It now
# has its own fixed project name, volume and port, and cannot touch production.
#
#   docker compose up -d        → postgresql://${POSTGRES_USER:-portfolio}:<password>@127.0.0.1:5434/${POSTGRES_DB:-portfolio}
#
# Tests do not need this: the server's db suites start their own embedded
# Postgres (see DEPLOYMENT.md, "Run Tests").
name: portfolio-dev

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
    ports:
      # 5434, not 5433: never collides with the Hetzner stack's port on the host.
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER:-portfolio}" -d "$${POSTGRES_DB:-portfolio}"']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata-dev:
