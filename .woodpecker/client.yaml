# Client checks (plan Phases 3 and 4): eslint, Prettier, the four typechecks,
# the unit tests, the strict build (no warnings, no prerendered index.html), e2e
# with axe and Lighthouse, then coverage and code health (Phase 9), the visual
# baselines and, nightly, Firefox and WebKit (Phase 10). Every step runs in the
# CI image (ci/Dockerfile). Steps that hold a value both CIs must agree on
# (flags, thresholds, pins) run ci/client.sh or ci/code-health.sh, which GitHub
# Actions calls too.
when:
  # Of the crons, the nightly. A manual run with NOTIFY_TEST=1 is the failure
  # email's test (prod-smoke.yaml), which runs alone.
  - event: [push, manual, cron]
    branch: main
    cron: nightly
    evaluate: 'NOTIFY_TEST != "1"'
  - event: pull_request
    path:
      include:
        - "client/**"
        # schema-parity.spec.ts reads the server's copy of the content schema.
        - "server/src/content/**"
        - "ci/client.sh"
        - "ci/code-health.sh"
        - "ci/vitest-report.mjs"
        - "ci/save-reports.sh"
        - "ci/bundle-size.mjs"
        - "ci/visual.sh"
        - ".woodpecker/client.yaml"

# When this pipeline rebuilds the CI image, the checks wait for it.
depends_on:
  - name: ci-image
    optional: true

variables:
  - &ci "portfolio-ci:node22-pw1.64.1"
  - &store "/var/lib/woodpecker-cache/pnpm-store:/pnpm-store"
  # The visual baselines, one set per CI image (ci/visual.sh).
  - &visual "/var/lib/woodpecker-cache/visual:/visual"
  # Every check after `install`: binaries called directly, no pnpm at run time.
  # Woodpecker runs depends_on as levels, each starting once the whole level
  # before it is done: the checks share the build's level, and e2e waits for
  # the slowest of them.
  - &check
    image: *ci
    directory: client
    depends_on: [install]
  # The bundle calls this API, and the served pages' CSP must allow it: the
  # build and anything serving it use the same value. No other VITE_* variable:
  # the build inlines every one into the bundle.
  - &api
    VITE_API_BASE_URL: https://api.alirezarastineh.me

steps:
  # The clone, the agent's pnpm store and the visual baselines belong to root,
  # and every other step runs as the CI image's node user: this one alone runs
  # as root, to hand them over.
  - name: owner
    image: *ci
    volumes: [*store, *visual]
    backend_options:
      docker:
        user: root
    commands:
      - chown -R node:node .
      # -h: the store links to the workspaces of earlier runs, which are gone.
      - find /pnpm-store /visual ! -user node -exec chown -h node:node {} +

  - name: install
    image: *ci
    directory: client
    depends_on: [owner]
    volumes: [*store]
    commands:
      - pnpm install --frozen-lockfile --store-dir /pnpm-store

  # Beside the other checks: Prettier skips what they write, which .gitignore
  # lists (dist/, the test reports, the caches).
  - name: format
    <<: *check
    commands:
      - node_modules/.bin/prettier --check .

  - name: lint
    <<: *check
    commands:
      - node_modules/.bin/eslint .

  - name: types
    <<: *check
    commands:
      - node_modules/.bin/ngc -p tsconfig.app.json --noEmit

  - name: e2e-types
    <<: *check
    commands:
      - node_modules/.bin/tsc -p e2e/tsconfig.json

  - name: node-types
    <<: *check
    commands:
      - node_modules/.bin/tsc -p tsconfig.node.json

  - name: spec-types
    <<: *check
    commands:
      - node_modules/.bin/tsc -p tsconfig.spec.json --noEmit

  # With coverage and its thresholds (plan Phase 9). The HTML report goes to the
  # reports.
  - name: unit
    <<: *check
    commands:
      - sh ../ci/client.sh unit

  # vite build, failing on any warning or a prerendered index.html.
  - name: build
    <<: *check
    environment: *api
    commands:
      - node scripts/build-check.mjs

  # The image's Chromium must be the one the locked @playwright/test drives.
  - name: pw-version
    <<: *check
    commands:
      - >-
        node -e "const locked = require('@playwright/test/package.json').version;
        if (locked !== process.env.PW_VERSION) { console.error('@playwright/test is ' + locked +
        ' but the CI image has ' + process.env.PW_VERSION + ': rebuild it (ci/Dockerfile)');
        process.exit(1); }"

  # 253 tests, axe included, against the build and a fixture API.
  - name: e2e
    <<: *check
    depends_on: [build, pw-version]
    environment: *api
    commands:
      - sh ../ci/client.sh e2e

  # What browsers download, against the last main run, whose totals the agent
  # keeps (plan Phase 9). Advisory: Lighthouse gates the bytes per page. Root:
  # the cache folder is root's.
  - name: bundle-size
    image: *ci
    directory: client
    depends_on: [build]
    failure: ignore
    volumes: ["/var/lib/woodpecker-cache/bundle-size:/bundle-size"]
    backend_options:
      docker:
        user: root
    commands:
      - node ../ci/bundle-size.mjs dist/analog/public/assets /bundle-size/main.json

  # After e2e, not beside it: a busy machine skews the scores.
  - name: lighthouse
    <<: *check
    depends_on: [e2e]
    environment: *api
    commands:
      - sh ../ci/client.sh lighthouse

  # Advisory code health (plan Phase 9), after Lighthouse, beside `visual`,
  # pass or fail: next to e2e or Lighthouse they slowed both (e2e 371 s against
  # 226 s in a dry run), and alone they take seconds. knip never marks the step
  # red: there are always some unused exports. madge finds no cycle today, so
  # its red means a new one.
  - name: knip
    <<: *check
    depends_on: [lighthouse]
    when:
      status: [success, failure]
    failure: ignore
    commands:
      - sh ../ci/code-health.sh knip

  - name: cycles
    <<: *check
    depends_on: [lighthouse]
    when:
      status: [success, failure]
    failure: ignore
    commands:
      - sh ../ci/code-health.sh cycles tsconfig.app.json

  # The visual project (plan Phase 10, ci/visual.sh): main takes the Linux
  # baselines and keeps them on the agent, one set per CI image; a pull request
  # compares with them, and the reports keep each difference's images.
  # Advisory, since a visual change can be intended: read its log. After
  # Lighthouse, which a busy machine skews.
  - name: visual
    <<: *check
    depends_on: [lighthouse]
    failure: ignore
    volumes: [*visual]
    environment:
      <<: *api
      VISUAL_IMAGE: *ci
    commands:
      - sh ../ci/visual.sh

  # Nightly, on cron runs only (plan Phase 10): the desktop suite in Firefox
  # and WebKit, Playwright's own builds of them, which the CI image carries.
  # Advisory. After `visual`, whose screenshots a busy machine can slow.
  - name: cross-browser
    <<: *check
    depends_on: [visual]
    when:
      - event: cron
    failure: ignore
    environment: *api
    commands:
      - sh ../ci/client.sh cross-browser

  # Pass or fail, since a failure is when the reports matter: copies them to
  # the agent's /srv/ci-reports and prints their Windows path. Root, like
  # `owner`: that folder is root's.
  - name: reports
    image: *ci
    directory: client
    depends_on:
      - e2e
      - lighthouse
      - visual
      # Cron runs only: dropped when the step isn't in the pipeline.
      - name: cross-browser
        optional: true
    when:
      status: [success, failure]
    volumes: ["/srv/ci-reports:/srv/ci-reports"]
    backend_options:
      docker:
        user: root
    commands:
      - sh ../ci/save-reports.sh playwright-report test-results .lighthouseci coverage

  # On a failure, the owner's email (plan Phase 13, ci/notify.mjs).
  - name: email
    image: *ci
    depends_on: [reports]
    when:
      - event: [push, cron, deployment]
        status: [failure]
      - event: manual
        evaluate: 'NOTIFY_TEST == "1"'
        status: [failure]
    environment:
      RESEND_API_KEY:
        from_secret: resend_api_key
      ALERT_TO:
        from_secret: alert_to
    commands:
      - node ci/notify.mjs
