# Infrastructure lint (plan Phase 6): the workflows, the shell scripts, the
# Dockerfiles, the compose files and the Caddyfiles, plus secrets (Phase 8),
# each tool from a pinned image. Every step starts at once (`depends_on: []`),
# so one run reports every failure. Nothing needs the Docker socket or a
# trusted volume. Each step runs ci/repo.sh inside its image, as GitHub Actions
# does with the same pins.
when:
  # Of the crons, the nightly. A manual run with NOTIFY_TEST=1 is the failure
  # email's test (prod-smoke.yaml), which runs alone.
  - event: [push, manual, cron]
    branch: main
    cron: nightly
    evaluate: 'NOTIFY_TEST != "1"'
  - event: pull_request

steps:
  # Every workflow in the folder, against the schema of the server's version.
  - name: workflows
    image: woodpeckerci/woodpecker-cli:v3.19.0-alpine
    depends_on: []
    commands:
      - sh ci/repo.sh workflows

  - name: shellcheck
    image: koalaman/shellcheck-alpine:v0.11.0
    depends_on: []
    commands:
      - sh ci/repo.sh shellcheck

  - name: hadolint
    image: hadolint/hadolint:v2.15.1-alpine
    depends_on: []
    commands:
      - sh ci/repo.sh hadolint

  # Every stack resolved as compose would start it; nothing starts.
  - name: compose
    image: docker:29.9.0-cli
    depends_on: []
    commands:
      - sh ci/repo.sh compose

  # Production's Caddy is 2.11.4 (`caddy version`, 2026-10-15).
  - name: caddy
    image: caddy:2.11.4-alpine
    depends_on: []
    commands:
      - sh ci/repo.sh caddy

  # Pinned by digest: Trivy's images 0.69.4 to 0.69.6 were replaced with
  # malicious ones in March 2026 (CVE-2026-33634), and a tag can be pushed again.
  - name: trivy
    image: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
    depends_on: []
    commands:
      - sh ci/repo.sh trivy

  # Secrets in the working tree (plan Phase 8). Pinned by digest, like Trivy.
  - name: gitleaks
    image: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    depends_on: []
    commands:
      - sh ci/repo.sh gitleaks

  # GitHub Actions' workflows (the GitHub Actions plan, Phase 2), so each CI lints
  # both definitions: actionlint for their syntax, zizmor for their security.
  # Pinned by digest.
  - name: actionlint
    image: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
    depends_on: []
    commands:
      - sh ci/repo.sh actionlint

  - name: zizmor
    image: ghcr.io/zizmorcore/zizmor:1.30.1@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101
    depends_on: []
    commands:
      - sh ci/repo.sh zizmor

  # The two CI definitions in step (ci/ci-parity.mjs): node's built-ins only.
  - name: parity
    image: portfolio-ci:node22-pw1.64.1
    depends_on: []
    commands:
      - sh ci/repo.sh parity

  # On a failure, the owner's email (plan Phase 13, ci/notify.mjs). After every
  # linter: they all start at once.
  - name: email
    image: portfolio-ci:node22-pw1.64.1
    depends_on:
      [
        workflows,
        shellcheck,
        hadolint,
        compose,
        caddy,
        trivy,
        gitleaks,
        actionlint,
        zizmor,
        parity,
      ]
    when:
      - event: [push, cron, deployment]
        status: [failure]
      - event: manual
        evaluate: 'NOTIFY_TEST == "1"'
        status: [failure]
    environment:
      RESEND_API_KEY:
        from_secret: resend_api_key
      ALERT_TO:
        from_secret: alert_to
    commands:
      - node ci/notify.mjs
