# Phase 0 smoke test: proves the webhook, the agent and the commit status
# (ci/woodpecker/push/smoke on GitHub). Delete it when the server workflow
# lands (plan Phase 2).
when:
  - event: [push, manual]
    branch: main

steps:
  - name: hello
    image: alpine:3.22
    commands:
      - echo "Woodpecker runs $CI_COMMIT_SHA on $CI_COMMIT_BRANCH"
      # x86_64 expected: the server's lockfile only allows x64 native builds.
      - uname -m
