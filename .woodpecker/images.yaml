# Builds the API and client images (plan Phase 6), as ci.yml's docker job does,
# through the agent's Docker: its BuildKit keeps the layer cache and the
# Dockerfiles' cache mounts warm between runs. Then an SBOM of each and their
# known vulnerabilities (Phase 8). The images are tagged with the commit and
# never pushed; `untag` removes the tags. The Docker socket is root in WSL on
# the owner's PC, never on production (README.md, Security notes).
when:
  - event: [push, manual, cron]
    branch: main
  - event: pull_request
    path:
      include:
        - "server/**"
        - "client/**"
        - ".woodpecker/images.yaml"

# After the checks, like ci.yml's docker job: beside them, the client's build
# would slow e2e and skew Lighthouse, and a red run needs no images. Optional,
# since a pull request runs only the workflows its paths match.
depends_on:
  - name: server
    optional: true
  - name: client
    optional: true

variables:
  - &docker "docker:29.9.0-cli"
  # Pinned by digest, as in repo.yaml.
  - &trivy "aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa"
  - &socket "/var/run/docker.sock:/var/run/docker.sock"
  # Trivy's vulnerability database, 1.5 GB unpacked: kept on the agent and
  # downloaded again (128 MB) only once it's stale.
  - &trivy-cache "/var/lib/woodpecker-cache/trivy:/trivy-cache"

steps:
  - name: api
    image: *docker
    depends_on: []
    volumes: [*socket]
    commands:
      - docker buildx build --tag "portfolio/api:$${CI_COMMIT_SHA}" server

  # ci.yml's build arguments: the bundle calls the public API, the server
  # render calls the compose network's.
  - name: client
    image: *docker
    depends_on: []
    volumes: [*socket]
    commands:
      - >-
        docker buildx build --tag "portfolio/client:$${CI_COMMIT_SHA}"
        --build-arg VITE_API_BASE_URL=https://api.alirezarastineh.me
        --build-arg API_INTERNAL_BASE_URL=http://api:3000
        client

  # What each image ships, OS packages and node_modules alike, as a CycloneDX
  # SBOM (plan Phase 8), for the reports and the scan below.
  - name: sbom
    image: *trivy
    depends_on: [api, client]
    volumes: [*socket, *trivy-cache]
    commands:
      - mkdir -p sbom
      - >-
        for image in api client; do
        trivy image --cache-dir /trivy-cache --skip-version-check --quiet --format cyclonedx
        --output "sbom/$${image}.cdx.json" "portfolio/$${image}:$${CI_COMMIT_SHA}"; done
      - ls -l sbom

  # Known vulnerabilities that have a fix, read from the SBOMs, so each image
  # is analysed once. Every HIGH is listed, and a CRITICAL fails the step: the
  # owner's choice (2026-10-16) while Analog's nx pins HIGHs nobody can fix
  # here; HIGH blocks once upgrades bring the count down. Waivers, each with
  # its reason, go in .trivyignore.
  - name: vulnerabilities
    image: *trivy
    depends_on: [sbom]
    volumes: [*trivy-cache]
    commands:
      - >-
        for image in api client; do echo "== $${image}";
        trivy sbom --cache-dir /trivy-cache --skip-version-check --quiet --table-mode detailed
        --severity HIGH,CRITICAL --ignore-unfixed "sbom/$${image}.cdx.json"; done
      - >-
        for image in api client; do
        trivy sbom --cache-dir /trivy-cache --skip-version-check --quiet --severity CRITICAL
        --ignore-unfixed --exit-code 1 "sbom/$${image}.cdx.json" > /dev/null
        || { echo "$${image}: a CRITICAL vulnerability, listed above"; exit 1; }; done

  # Pass or fail, or the commits' tags would pile up. After the SBOMs, which
  # read the images. The layers stay in the build cache, which
  # agent-cleanup.sh caps; it also removes the tags of a run that was canceled
  # before this step.
  - name: untag
    image: *docker
    depends_on: [sbom]
    when:
      status: [success, failure]
    volumes: [*socket]
    commands:
      - >-
        docker image ls --format '{{.Repository}}:{{.Tag}}'
        --filter "reference=portfolio/*:$${CI_COMMIT_SHA}" | xargs -r docker image rm

  # The SBOMs, to the agent's /srv/ci-reports, as client.yaml saves its
  # reports. Root, like every step here: that folder is root's.
  - name: reports
    image: *docker
    depends_on: [vulnerabilities, untag]
    when:
      status: [success, failure]
    volumes: ["/srv/ci-reports:/srv/ci-reports"]
    commands:
      - sh ci/save-reports.sh sbom
