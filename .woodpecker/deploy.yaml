# Deploys a green main commit to production (plan Phase 12). Start it from the
# commit's pipeline in the UI: Deploy, target `production`. The repository
# setting "Allow deployments" must be on. Nothing else runs on this event:
# every other workflow lists its own events.
#
# The steps run in order, and a failure skips the rest:
# 1. guard: production only, main's tip only, and only once every check on
#    that commit passed (ci/deploy-guard.mjs);
# 2. images: both images built on the agent and pushed to GHCR as public
#    packages, which production pulls without logging in;
# 3. rollout: over SSH, production's forced command (deploy/hetzner/ci-deploy.sh)
#    fast-forwards its checkout to this commit, then runs rollout.sh: the
#    pre-deploy backup, the API, the client once the API is healthy, then
#    verify-deploy.sh;
# 4. latest: `:latest` names what production runs from then on.
# The secrets are the deployment event's alone (deploy/woodpecker/README.md,
# "Deploys"). Woodpecker posts no GitHub status for a deployment started in
# its UI: the result is in the UI. Steps 2–4 run ci/deploy.sh, which GitHub's
# deploy.yml calls too (the GitHub Actions plan, Part E).
when:
  - event: deployment
    evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "production"'

variables:
  - &docker "docker:29.9.0-cli"
  - &socket "/var/run/docker.sock:/var/run/docker.sock"
  - &registry "ghcr.io/alirezarastineh/portfolio-2026"
  # A classic token with write:packages: GHCR takes no fine-grained ones.
  - &ghcr-token
    from_secret: ghcr_token

steps:
  - name: guard
    image: portfolio-ci:node22-pw1.64.1
    commands:
      - node ci/deploy-guard.mjs

  # As images.yaml builds them, through the agent's Docker and its warm cache,
  # then pushed under the commit's tag, and checked to be public (ci/deploy.sh).
  - name: images
    image: *docker
    volumes: [*socket]
    environment:
      GHCR_TOKEN: *ghcr-token
    commands:
      - sh ci/deploy.sh images

  # Over SSH, production's forced command, ci-deploy.sh; the rollout runs there
  # as a systemd unit, and this step follows its log (ci/deploy.sh).
  - name: rollout
    image: *docker
    environment:
      DEPLOY_SSH_KEY:
        from_secret: deploy_ssh_key
      DEPLOY_KNOWN_HOSTS:
        from_secret: deploy_known_hosts
      DEPLOY_HOST:
        from_secret: deploy_host
      DEPLOY_USER:
        from_secret: deploy_user
    commands:
      - sh ci/deploy.sh rollout

  # `:latest` names what production runs from then on (ci/deploy.sh).
  - name: latest
    image: *docker
    environment:
      GHCR_TOKEN: *ghcr-token
    commands:
      - sh ci/deploy.sh latest

  # Pass or fail: the build left both images tagged on the agent.
  # agent-cleanup.sh removes what a canceled run leaves.
  - name: untag
    image: *docker
    when:
      status: [success, failure]
    volumes: [*socket]
    environment:
      REGISTRY: *registry
    commands:
      - >-
        docker image ls --format '{{.Repository}}:{{.Tag}}'
        --filter "reference=$${REGISTRY}/*:$${CI_COMMIT_SHA}" | xargs -r docker image rm

  # On a failure, the owner's email (plan Phase 13, ci/notify.mjs).
  - name: email
    image: portfolio-ci:node22-pw1.64.1
    when:
      - event: [push, cron, deployment]
        status: [failure]
      - event: manual
        evaluate: 'NOTIFY_TEST == "1"'
        status: [failure]
    environment:
      RESEND_API_KEY:
        from_secret: resend_api_key
      ALERT_TO:
        from_secret: alert_to
    commands:
      - node ci/notify.mjs
