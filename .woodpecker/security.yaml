# Supply chain (plan Phase 8): known vulnerabilities and licences in the
# production dependencies, plus osv-scanner and semgrep, which only report. It
# runs when a lockfile or one of its checks changes, on manual runs, and on the
# nightly cron (Phase 13). Every step runs ci/security.sh, which GitHub Actions
# calls too.
when:
  - event: push
    branch: main
    path:
      include:
        - "server/pnpm-lock.yaml"
        - "client/pnpm-lock.yaml"
        - "ci/security.sh"
        - "ci/check-audit.mjs"
        - "ci/check-licenses.mjs"
        - ".woodpecker/security.yaml"
  - event: pull_request
    path:
      include:
        - "server/pnpm-lock.yaml"
        - "client/pnpm-lock.yaml"
        - "ci/security.sh"
        - "ci/check-audit.mjs"
        - "ci/check-licenses.mjs"
        - ".woodpecker/security.yaml"
  # Of the crons, the nightly. A manual run with NOTIFY_TEST=1 is the failure
  # email's test (prod-smoke.yaml), which runs alone.
  - event: [manual, cron]
    branch: main
    cron: nightly
    evaluate: 'NOTIFY_TEST != "1"'

# When this pipeline rebuilds the CI image, the checks wait for it.
depends_on:
  - name: ci-image
    optional: true

variables:
  - &ci "portfolio-ci:node22-pw1.64.1"
  - &store "/var/lib/woodpecker-cache/pnpm-store:/pnpm-store"

# Levels: owner, then install and osv-scanner, then the checks together, so one
# run reports every failure.
steps:
  # As in the other workflows: the clone and the pnpm store go to node.
  - name: owner
    image: *ci
    volumes: [*store]
    backend_options:
      docker:
        user: root
    commands:
      - chown -R node:node .
      - find /pnpm-store ! -user node -exec chown -h node:node {} +

  # Production dependencies only: what the images ship, and what the licence
  # check reads.
  - name: install
    image: *ci
    depends_on: [owner]
    volumes: [*store]
    commands:
      - sh ci/security.sh install

  # Report only: findings leave the step green, as the owner chose
  # (2026-10-16); an error still marks it red. Pinned by digest, like every
  # tool image.
  - name: osv-scanner
    image: ghcr.io/google/osv-scanner:v2.6.0@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa
    depends_on: [owner]
    failure: ignore
    commands:
      - sh ci/security.sh osv-scanner

  # Every HIGH and CRITICAL advisory is listed, and a CRITICAL fails.
  - name: audit
    image: *ci
    depends_on: [install]
    commands:
      - sh ci/security.sh audit

  # Licences outside the allowlist fail. pnpm reads the licences from the store.
  - name: licenses
    image: *ci
    depends_on: [install]
    volumes: [*store]
    commands:
      - sh ci/security.sh licenses

  # Advisory: semgrep's TypeScript and Node rules over both src trees.
  - name: semgrep
    image: semgrep/semgrep:1.178.0@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b
    depends_on: [install]
    failure: ignore
    commands:
      - sh ci/security.sh semgrep

  # On a failure, the owner's email (plan Phase 13, ci/notify.mjs).
  - name: email
    image: *ci
    depends_on: [audit, licenses, semgrep]
    when:
      - event: [push, cron, deployment]
        status: [failure]
      - event: manual
        evaluate: 'NOTIFY_TEST == "1"'
        status: [failure]
    environment:
      RESEND_API_KEY:
        from_secret: resend_api_key
      ALERT_TO:
        from_secret: alert_to
    commands:
      - node ci/notify.mjs
