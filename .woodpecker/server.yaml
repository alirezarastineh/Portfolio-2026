# Server checks (plan Phase 2): eslint, Prettier, the typechecks, the build,
# drizzle-kit check and the unit and db tests, then the invariants (Phase 7),
# coverage and code health (Phase 9). The db specs use a Postgres service,
# production's image, rather than embedded Postgres. The checks run in the CI
# image (ci/Dockerfile), the client's toolchain.
when:
  # Of the crons, the nightly. A manual run with NOTIFY_TEST=1 is the failure
  # email's test (prod-smoke.yaml), which runs alone.
  - event: [push, manual, cron]
    branch: main
    cron: nightly
    evaluate: 'NOTIFY_TEST != "1"'
  - event: pull_request
    path:
      include:
        - "server/**"
        - "deploy/hetzner/*.sql"
        # `migrations` checks that it names every migration.
        - "deploy/hetzner/verify-deploy.sh"
        - "ci/vitest-report.mjs"
        - "ci/save-reports.sh"
        - ".woodpecker/server.yaml"

# When this pipeline rebuilds the CI image, the checks wait for it.
depends_on:
  - name: ci-image
    optional: true

variables:
  - &ci "portfolio-ci:node22-pw1.64.1"
  - &store "/var/lib/woodpecker-cache/pnpm-store:/pnpm-store"
  # Every check after `install`: binaries called directly, no pnpm at run time.
  # Woodpecker runs depends_on as levels, each starting once the whole level
  # before it is done: the checks and db share one level.
  - &check
    image: *ci
    directory: server
    depends_on: [install]

services:
  - name: postgres
    image: postgres:17-alpine
    # The agent kills services once the steps are done (exit 137), which the
    # server's FORCE_IGNORE_SERVICE_FAILURE=false would count as a failed run.
    # A Postgres that dies mid-run still fails the db step.
    failure: ignore
    environment:
      POSTGRES_PASSWORD: postgres
      # pg-global-setup.ts needs the database to exist, and its guard wants
      # "test" in the name.
      POSTGRES_DB: portfolio_test

steps:
  # The clone and the agent's pnpm store belong to root, and every other step
  # runs as the CI image's node user: this one alone runs as root, to hand them over.
  - name: owner
    image: *ci
    volumes: [*store]
    backend_options:
      docker:
        user: root
    commands:
      - chown -R node:node .
      # -h: the store links to the workspaces of earlier runs, which are gone.
      - find /pnpm-store ! -user node -exec chown -h node:node {} +

  - name: install
    image: *ci
    directory: server
    depends_on: [owner]
    volumes: [*store]
    commands:
      - pnpm install --frozen-lockfile --store-dir /pnpm-store

  # Beside the other checks: .prettierignore keeps Prettier out of dist/ and
  # .vitest/, which they write.
  - name: format
    <<: *check
    commands:
      - node_modules/.bin/prettier --check .

  - name: lint
    <<: *check
    commands:
      - node_modules/.bin/eslint .

  - name: types
    <<: *check
    commands:
      - node_modules/.bin/tsc --noEmit

  - name: spec-types
    <<: *check
    commands:
      - node_modules/.bin/tsc -p tsconfig.spec.json

  - name: build
    <<: *check
    commands:
      - node_modules/.bin/tsc

  # Compares the migration snapshots; needs no database.
  - name: drizzle-check
    <<: *check
    commands:
      - node_modules/.bin/drizzle-kit check

  # The project's invariants (plan Phase 7). Every migration is additive (0009
  # is the one waiver) and in the journal, and verify-deploy.sh checks each one
  # from 0008 on. Reads files only.
  - name: migrations
    <<: *check
    commands:
      - node scripts/check-migrations.mjs

  # schema.ts changed without its migration: drizzle-kit generate, writing into
  # a copy of drizzle/, must find nothing to migrate.
  - name: drift
    <<: *check
    commands:
      - node scripts/check-drift.mjs

  # unit and db also write a blob report each, with their coverage, for the
  # `coverage` step to merge. Their own coverage reports stay in the step's
  # /tmp: the two run at once and would share one coverage folder otherwise.
  - name: unit
    <<: *check
    commands:
      # Nightly, the property tests take a random seed (properties.spec.ts
      # reads FC_SEED; other runs keep its fixed one). A failure prints it, and
      # FC_SEED=<seed> repeats the run locally.
      - >-
        if [ "$${CI_PIPELINE_EVENT}" = cron ]; then
        FC_SEED=$$(( $$(od -An -N4 -tu4 /dev/urandom) % 2147483647 )); export FC_SEED;
        echo "FC_SEED=$${FC_SEED}: the property tests' seed for this run"; fi
      - >-
        node_modules/.bin/vitest run --project unit --reporter=default --reporter=json
        --outputFile.json=/tmp/vitest-unit.json --reporter=blob --outputFile.blob=.vitest/blobs/unit.json
        --coverage --coverage.reportsDirectory=/tmp/coverage --coverage.reporter=json-summary
      - node ../ci/vitest-report.mjs /tmp/vitest-unit.json unit

  # Nothing checks that a service is ready. Bounded, so a Postgres that never
  # comes up fails here rather than at the pipeline timeout.
  - name: wait-pg
    image: postgres:17-alpine
    depends_on: []
    commands:
      - timeout 120 sh -c 'until pg_isready -h postgres -U postgres -q; do sleep 1; done'
      - pg_isready -h postgres -U postgres

  # With TEST_DATABASE_URL set, pg-global-setup.ts skips embedded Postgres,
  # checks the guard and runs the real migrations. The service's user is a
  # superuser, which migrate.db.spec.ts needs (roles, CREATE DATABASE umami).
  - name: db
    <<: *check
    depends_on: [install, wait-pg]
    environment:
      TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/portfolio_test
    commands:
      - >-
        node_modules/.bin/vitest run --project db --reporter=default --reporter=json
        --outputFile.json=/tmp/vitest-db.json --reporter=blob --outputFile.blob=.vitest/blobs/db.json
        --coverage --coverage.reportsDirectory=/tmp/coverage --coverage.reporter=json-summary
      - node ../ci/vitest-report.mjs /tmp/vitest-db.json db

  # Coverage of unit and db together (plan Phase 9), merged from their blobs,
  # with the thresholds just under the first measured figures (2026-10-16:
  # lines 90.43%, statements 88.79%, functions 91.32%, branches 82.02%). Raise
  # them by hand as tests are added; CI never writes them. Branches keeps half
  # a point: a few depend on the tests' timing, so the same code measured
  # 81.99% to 82.03% (2026-10-17), and 82 failed a run that changed no code.
  - name: coverage
    <<: *check
    depends_on: [unit, db]
    commands:
      - >-
        node_modules/.bin/vitest run --merge-reports=.vitest/blobs --reporter=json
        --outputFile.json=/tmp/vitest-merged.json --coverage
        --coverage.thresholds.lines=90 --coverage.thresholds.statements=88
        --coverage.thresholds.functions=91 --coverage.thresholds.branches=81.5

  # Report only (plan Phase 9): unused files, exports and dependencies, by the
  # rules in knip.js. Its findings never mark the step red (the owner's choice,
  # 2026-10-16): there are always some. After the tests, beside `coverage`: in
  # their level it slowed them. npx resolves only versions published before
  # --before, so a release newer than the pin's age never runs here.
  - name: knip
    <<: *check
    depends_on: [unit, db]
    failure: ignore
    commands:
      - npx --yes --no-update-notifier --before=2026-10-02 knip@6.39.0 --no-progress --no-exit-code

  # Circular imports that survive compilation: type-only imports, which
  # TypeScript erases, are skipped. None today, so any finding is new. After
  # the tests, like knip.
  - name: cycles
    <<: *check
    depends_on: [unit, db]
    failure: ignore
    environment:
      madge_detectiveOptions__ts__skipTypeImports: "true"
    commands:
      - npx --yes --no-update-notifier --before=2026-10-02 madge@8.0.0 --circular --no-spinner --extensions ts --ts-config tsconfig.json src

  # The merged coverage report, to the agent's /srv/ci-reports, pass or fail,
  # as client.yaml saves its reports. Root: that folder is root's.
  - name: reports
    image: *ci
    directory: server
    depends_on: [coverage]
    when:
      status: [success, failure]
    volumes: ["/srv/ci-reports:/srv/ci-reports"]
    backend_options:
      docker:
        user: root
    commands:
      - sh ../ci/save-reports.sh coverage

  # On a failure, the owner's email (plan Phase 13, ci/notify.mjs).
  - name: email
    image: *ci
    depends_on: [reports]
    when:
      - event: [push, cron, deployment]
        status: [failure]
      - event: manual
        evaluate: 'NOTIFY_TEST == "1"'
        status: [failure]
    environment:
      RESEND_API_KEY:
        from_secret: resend_api_key
      ALERT_TO:
        from_secret: alert_to
    commands:
      - node ci/notify.mjs
