# Weekly checks (plan Phase 13), started by the cron `weekly` (repository
# settings → Crons):
# - gitleaks over the whole history: repo.yaml scans the working tree on every
#   push, and a secret committed once lives on in git after it is removed;
# - `pnpm outdated` in both packages, a report only: the owner does upgrades;
# - Woodpecker's version against its latest release (ci/woodpecker-version.mjs).
when:
  - event: cron
    cron: weekly

# Every commit, not the default clone's one: no depth, and not partial, so the
# blobs are there for gitleaks to read. The default clone plugin's tag.
clone:
  - name: clone
    image: woodpeckerci/plugin-git:2.10.1
    settings:
      partial: false
      depth: 0

variables:
  - &ci "portfolio-ci:node22-pw1.64.1"

steps:
  # gitleaks over the whole history (ci/weekly.sh), which must be there first.
  # Pinned by digest.
  - name: history
    image: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    depends_on: []
    commands:
      - sh ci/weekly.sh history

  # Report only, exit 0: there is nearly always something.
  - name: outdated
    image: *ci
    depends_on: []
    failure: ignore
    commands:
      - sh ci/weekly.sh outdated

  - name: woodpecker
    image: *ci
    depends_on: []
    commands:
      - node ci/woodpecker-version.mjs

  # On a failure, the owner's email (plan Phase 13, ci/notify.mjs).
  - name: email
    image: *ci
    depends_on: [history, outdated, woodpecker]
    when:
      - event: [push, cron, deployment]
        status: [failure]
      - event: manual
        evaluate: 'NOTIFY_TEST == "1"'
        status: [failure]
    environment:
      RESEND_API_KEY:
        from_secret: resend_api_key
      ALERT_TO:
        from_secret: alert_to
    commands:
      - node ci/notify.mjs
