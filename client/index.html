<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <base href="/" />
    <!-- The browser's own colours (its toolbar, on phones): the page's
         background, dark as the server renders it. theme-init below and
         ThemeService switch it with the theme (THEME_COLOR). -->
    <meta name="theme-color" content="#101012" />
    <meta name="color-scheme" content="dark light" />
    <!-- The saved theme, or else the system's, before anything paints: the
         `data-theme` the tokens follow, Spartan's `dark` class, and the
         theme-color above. With storage blocked (privacy settings) there is no
         saved choice, and the system decides. The server renders dark; this
         only ever switches to light. Nonced per request by id
         (src/app/security/csp-nonce.ts); keep it tiny, and its comments out
         here: the build drops HTML comments (vite-plugins/strip-html-comments.ts),
         not script ones. -->
    <script id="theme-init">
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("theme");
        } catch (e) {
          t = null;
        }
        if (t !== "light" && t !== "dark") {
          var light = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches;
          t = light ? "light" : "dark";
        }
        var r = document.documentElement;
        r.dataset.theme = t;
        r.classList.toggle("dark", t === "dark");
        if (t === "light") {
          document.querySelector('meta[name="theme-color"]').content = "#f9fafb";
        }
      })();
    </script>
    <!-- A shared link's question (`?ask=`, visitor plan V17), lifted out of the
         address before analytics or the app can read it: the app takes it from
         window.__askFromLink and puts it in the prompt, unsent. Umami's
         before-send hook (data-before-send, monitoring/analytics.ts) strips an
         `ask` parameter from any address it would send, its referrer too.
         Nonced per request by id (src/app/security/csp-nonce.ts); keep it tiny. -->
    <script id="ask-link">
      (function () {
        function strip(url) {
          try {
            var u = new URL(url, location.href);
            if (!u.searchParams.has("ask")) return url;
            u.searchParams.delete("ask");
            return /^\/(?!\/)/.test(url) ? u.pathname + u.search + u.hash : u.href;
          } catch (error) {
            console.warn("[ask-link] Unable to parse URL, using raw string:", error);
            return url;
          }
        }
        window.umamiBeforeSend = function (type, payload) {
          if (payload && payload.url) payload.url = strip(payload.url);
          if (payload && payload.referrer) payload.referrer = strip(payload.referrer);
          return payload;
        };
        try {
          var question = new URL(location.href).searchParams.get("ask");
          if (question !== null) {
            window.__askFromLink = question;
            history.replaceState(
              history.state,
              "",
              strip(location.pathname + location.search + location.hash),
            );
          }
        } catch (error) {
          console.warn("[ask-link] Unable to extract link question:", error);
        }
      })();
    </script>
    <!-- Must precede the app's module script, which the build moves into
         <head>: it configures zod before any schema exists (see the file). -->
    <script defer src="/zod-config.js"></script>

    <title>Alireza Rastineh — Full Stack AI Engineer</title>
    <meta
      name="description"
      content="Full Stack AI Engineer. Reliable cloud infrastructure meets defensive AI engineering — production-grade Angular, FastAPI, RAG pipelines, and observability."
    />
    <meta name="author" content="Alireza Rastineh" />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Canonical, hreflang and JSON-LD are written per page (src/app/seo/head.ts). -->

    <!-- The sans face every page sets its headline in (src/styles/fonts.css):
         fetched with the stylesheet rather than after it, so the text does not
         re-wrap when it arrives. Geist Mono is not preloaded: it sets only short
         labels, where a monospace fallback has nearly the same widths, and
         every byte before the first paint delays it on a slow link. -->
    <link
      rel="preload"
      href="/node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Alireza Rastineh" />
    <meta property="og:title" content="Alireza Rastineh — Full Stack AI Engineer" />
    <meta
      property="og:description"
      content="Defensive AI integration, production-grade full-stack systems, and resilient ML infrastructure."
    />
    <meta property="og:url" content="https://alirezarastineh.me/en" />
    <meta property="og:image" content="https://alirezarastineh.me/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Alireza Rastineh — Full Stack AI Engineer" />
    <meta
      name="twitter:description"
      content="Defensive AI integration, production-grade full-stack systems, and resilient ML infrastructure."
    />
    <meta name="twitter:image" content="https://alirezarastineh.me/og.png" />

    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <app-root></app-root>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
