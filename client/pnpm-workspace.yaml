allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  less: true
  lmdb: true
  msgpackr-extract: true
  nx: true
minimumReleaseAge: 0
# Peers these packages declare too narrowly for the versions in use.
peerDependencyRules:
  allowAny:
    - marked
    - typescript
    - chokidar
    - node-fetch
