  <circle cx="800" cy="500" r="320" fill="url(#p3-glow)" />

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#9CA3AF">
    <text x="100" y="120" font-size="20" letter-spacing="3">// rag.graph</text>
  </g>

  <g stroke="#818CF873" stroke-width="1.5" fill="none">
    <line x1="800" y1="500" x2="320" y2="240" />
    <line x1="800" y1="500" x2="1280" y2="240" />
    <line x1="800" y1="500" x2="200" y2="500" />
    <line x1="800" y1="500" x2="1400" y2="500" />
    <line x1="800" y1="500" x2="320" y2="760" />
    <line x1="800" y1="500" x2="1280" y2="760" />
    <line x1="320" y1="240" x2="200" y2="500" />
    <line x1="1280" y1="240" x2="1400" y2="500" />
    <line x1="320" y1="760" x2="200" y2="500" />
    <line x1="1280" y1="760" x2="1400" y2="500" />
    <line x1="320" y1="240" x2="1280" y2="240" stroke-dasharray="4 6" />
    <line x1="320" y1="760" x2="1280" y2="760" stroke-dasharray="4 6" />
  </g>

  <g>
