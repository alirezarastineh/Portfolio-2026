<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Project three mockup">
  <defs>
    <pattern id="p3-grid" width="40" height="40" patternUnits="userSpaceOnUse">
