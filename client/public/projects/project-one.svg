    <linearGradient id="p1-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366F12E" />
      <stop offset="1" stop-color="#6366F100" />
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="#141416" />
  <rect width="1600" height="1000" fill="url(#p1-grid)" />
  <rect width="1600" height="500" fill="url(#p1-glow)" />

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#9CA3AF">
