    <text x="124" y="316" font-size="14" fill="#FB923C">+ 12% faster</text>

    <text x="584" y="210" font-size="18" fill="#9CA3AF">tokens / sec</text>
    <text x="584" y="282" font-size="48" fill="#F3F4F6" font-weight="600">186</text>
    <text x="584" y="316" font-size="14" fill="#818CF8">streaming</text>

    <text x="1044" y="210" font-size="18" fill="#9CA3AF">cache.hit</text>
