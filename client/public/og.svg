  </g>

  <g transform="translate(880, 140)">
    <circle cx="120" cy="120" r="120" fill="none" stroke="oklch(0.62 0.19 280 / 0.4)" stroke-width="1.5" />
    <circle cx="120" cy="120" r="80" fill="none" stroke="oklch(0.62 0.19 280 / 0.6)" stroke-width="1.5" />
    <circle cx="120" cy="120" r="40" fill="oklch(0.10 0 0)" stroke="oklch(0.72 0.2 45)" stroke-width="2" />
    <text x="120" y="118" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" fill="oklch(0.95 0 0)" font-weight="600">router</text>
    <text x="120" y="138" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="oklch(0.72 0.2 45)">orchestrator</text>

    <circle cx="20" cy="120" r="10" fill="oklch(0.10 0 0)" stroke="oklch(0.62 0.19 280)" stroke-width="1.5" />
