    <linearGradient id="og-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="oklch(0.72 0.2 45)" />
      <stop offset="1" stop-color="oklch(0.62 0.19 280)" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="oklch(0.05 0 0)" />
  <rect width="1200" height="630" fill="url(#og-grid)" />
  <rect width="1200" height="630" fill="url(#og-glow)" />

  <g font-family="ui-monospace, SFMono-Regular, monospace" fill="oklch(0.62 0 0)">
    <text x="80" y="100" font-size="20" letter-spacing="4">// alirezarastineh.me</text>
  </g>

  <g>
