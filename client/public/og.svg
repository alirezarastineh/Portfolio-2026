<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Alireza Rastineh  Full Stack AI Software Engineer">
  <defs>
    <pattern id="og-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1" fill="oklch(0.62 0.19 280 / 0.32)" />
    </pattern>
    <radialGradient id="og-glow" cx="78%" cy="40%" r="55%">
      <stop offset="0" stop-color="oklch(0.62 0.19 280 / 0.40)" />
      <stop offset="1" stop-color="oklch(0.62 0.19 280 / 0)" />
