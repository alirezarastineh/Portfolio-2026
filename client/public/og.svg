    <text x="100" y="154" font-family="ui-monospace, SFMono-Regular, monospace" font-size="18" fill="oklch(0.85 0 0)" letter-spacing="2">@alirezarastineh</text>
  </g>

  <g font-family="Geist, ui-sans-serif, system-ui, sans-serif" fill="oklch(0.95 0 0)">
    <text x="80" y="288" font-size="80" font-weight="600" letter-spacing="-2">Alireza Rastineh</text>
  </g>

  <g font-family="Geist, ui-sans-serif, system-ui, sans-serif" fill="oklch(0.85 0 0)">
