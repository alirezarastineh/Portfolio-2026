    <text x="80" y="438" font-size="48" font-weight="500" letter-spacing="-1">Meets AI Intelligence.</text>
  </g>

  <line x1="80" y1="478" x2="380" y2="478" stroke="url(#og-line)" stroke-width="3" />

  <g font-family="ui-monospace, SFMono-Regular, monospace" fill="oklch(0.62 0 0)" font-size="20">
